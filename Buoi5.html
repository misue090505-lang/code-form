<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BT BUỔI 5</title>
    <link rel="stylesheet" href="Buoi5.css">
</head>
<body>
    <div class="container">
        <div class="title">GÓP Ý LIÊN HỆ VỚI 24H</div>
        <form action="https://www.24h.com.vn/gop-y" method="post">
            <div class="form-group">
                <label for="name">Họ và tên:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Địa chỉ Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="tel">Số điện thoại:</label>
                <input type="tel" id="tel" name="tel" required>
            </div>
            <div class="form-group">
                <label for="Address">Địa chỉ nơi cư trú:</label>
                <input type="text" id="address" name="address">
            </div>
            <div class="form-group">
                <label for="subject">Tiêu đề:</label>
                <input type="text" id="subject" name="subject" value="Góp ý 24H">
            </div>
            <div class="form-group">
                <label for="content">Nội dung:</label>
                <textarea id="content" name="content" rows="5" required></textarea>
            </div>
            <div class="button">
                <input type="submit" value="GỬI">
                <input type="reset" value="THOÁT">
            </div>

            <div class="footer-note">(*) Đồng ý. Tiêu đề gửi bằng tiếng Việt Unicode</div>
        </form>
    </div>
</body>
</html>
