<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Form đăng kí</h1>
    <form action="">
        <label for="username">Tên khách hàng:</label>
        <input type="text" placeholder="Nhập tên khách" id="username" name="username" select="on"><br>
        <label for="tel">Số điện thoại:</label>
        <input type="tel" placeholder="Nhập số điện thoại" id="tel" name="tel"><br>
        <label for="chose product">Chọn sản phẩm:</label>
        <select name="chose product" id="chose product">
            <option value="">--Chọn sản phẩm--</option>
            <option value="product1">Sản phẩm 1</option>
            <option value="product2">Sản phẩm 2</option>
            <option value="product3">Sản phẩm 3</option>
        </select><br>
        <label for="quantity">Số lượng:</label>
        <input type="number" placeholder="Nhập số lượng" id="quantity" name="quantity"><br>
        <label for="address">Địa chỉ:</label>
        <input type="text" placeholder="Nhập địa chỉ giao hàng" id="address" name="address"><br>
        <button type="submit">Đặt hàng</button>
    </form>
</body>
</html>
